<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PAPERFORM PRO // DECODER STATION</title>
    <style>
        :root { 
            --p-blue: #00d4ff; --p-black: #09090b; --p-gray: #121214; 
            --p-red: #ff003c; --p-green: #00ff66; --text: #e4e4e7;
        }
        body { background: var(--p-black); color: var(--text); font-family: 'JetBrains Mono', monospace; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        #sidebar { width: 360px; background: var(--p-gray); border-right: 1px solid #27272a; padding: 25px; display: flex; flex-direction: column; box-shadow: 5px 0 20px rgba(0,0,0,0.5); }
        #scanner-viewport { flex-grow: 1; display: flex; flex-direction: column; background: #000; position: relative; justify-content: center; align-items: center; }
        
        .header { border-bottom: 2px solid var(--p-blue); padding-bottom: 15px; margin-bottom: 25px; }
        .header h1 { font-size: 1.4rem; margin: 0; letter-spacing: 3px; color: var(--text); }
        .header span { color: var(--p-blue); }

        .module { background: #18181b; border: 1px solid #27272a; border-radius: 6px; padding: 18px; margin-bottom: 15px; border-left: 3px solid var(--p-blue); }
        h3 { font-size: 0.75rem; color: #a1a1aa; margin: 0 0 12px 0; text-transform: uppercase; }

        .btn-scan { background: var(--p-blue); color: #000; border: none; padding: 14px; width: 100%; cursor: pointer; font-weight: bold; border-radius: 4px; text-transform: uppercase; transition: 0.2s; }
        .btn-scan:hover { box-shadow: 0 0 15px var(--p-blue); filter: brightness(1.2); }
        
        #preview-container { width: 80%; height: 70%; border: 2px solid #333; position: relative; overflow: hidden; background: #050505; }
        .reticle { position: absolute; top: 50%; left: 50%; width: 200px; height: 200px; border: 1px solid rgba(0, 212, 255, 0.5); transform: translate(-50%, -50%); pointer-events: none; }
        .reticle::before { content: ''; position: absolute; top: 50%; left: -10%; width: 120%; height: 1px; background: var(--p-blue); }

        canvas { display: none; } /* Hidden processing canvas */
        #console { height: 150px; background: #09090b; border-top: 1px solid #27272a; padding: 15px; color: var(--p-blue); font-size: 0.75rem; width: 100%; overflow-y: auto; box-sizing: border-box; }
        
        .mode-indicator { font-size: 0.6rem; padding: 4px 8px; border-radius: 3px; background: #222; margin-bottom: 10px; display: inline-block; }
    </style>
</head>
<body>

    <aside id="sidebar">
        <div class="header"><h1>PAPER<span>FORM</span> DEC</h1></div>
        
        <div class="module">
            <div class="mode-indicator" id="modeStat">STATUS: AWAITING INPUT</div>
            <h3>1. Input Source</h3>
            <input type="file" id="uploadCapture" accept="image/*" style="width:100%; background:#000; color:#fff; border:1px solid #333; padding:5px; font-size:0.7rem;">
            <button class="btn-scan" style="margin-top:10px;" id="processBtn">Analyze Optical Form</button>
        </div>

        <div class="module">
            <h3>2. Audio Playback</h3>
            <button class="btn-scan" style="background:var(--p-green);" id="playBtn" disabled>Engage Playback</button>
        </div>

        <div class="module">
            <h3>3. Project Navigation</h3>
            <a href="index.html" style="color:var(--p-blue); font-size:0.75rem; text-decoration:none;">&lt;&lt; Return to Encoder</a>
        </div>

        <div style="margin-top:auto; font-size:0.6rem; color:#444; text-align:center;">DECODER_CORE // v3.0.1</div>
    </aside>

    <main id="scanner-viewport">
        <div id="preview-container">
            <div class="reticle"></div>
            <img id="viewImg" style="width:100%; height:100%; object-fit:contain; display:none;">
        </div>
        <div id="console">>> SYSTEM READY. UPLOAD A SCAN OR PHOTO TO BEGIN...</div>
    </main>

    <canvas id="procCanvas"></canvas>

    <script>
        class PaperDecoder {
            constructor() {
                this.canvas = document.getElementById('procCanvas');
                this.ctx = this.canvas.getContext('2d', { willReadFrequently: true });
                this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                this.decodedBuffer = null;
            }

            log(msg, type = 'info') {
                const con = document.getElementById('console');
                const color = type === 'error' ? '#ff003c' : '#00d4ff';
                con.innerHTML += `<br><span style="color:${color}">>> ${msg.toUpperCase()}</span>`;
                con.scrollTop = con.scrollHeight;
            }

            updateStatus(text) {
                document.getElementById('modeStat').innerText = `STATUS: ${text.toUpperCase()}`;
            }
        }
        const decoder = new PaperDecoder();
    </script>

    <script>
        const upload = document.getElementById('uploadCapture');
        const viewImg = document.getElementById('viewImg');

        upload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            viewImg.src = URL.createObjectURL(file);
            viewImg.style.display = 'block';
            decoder.log("Image Loaded. Ready for analysis.");
        });

        document.getElementById('processBtn').addEventListener('click', () => {
            if (!viewImg.src) return decoder.log("Error: No image to scan", "error");
            
            decoder.log("Detecting Optical Format...");
            
            // Draw image to hidden canvas for pixel math
            decoder.canvas.width = viewImg.naturalWidth;
            decoder.canvas.height = viewImg.naturalHeight;
            decoder.ctx.drawImage(viewImg, 0, 0);

            const sampleData = decoder.ctx.getImageData(10, 10, 50, 50).data;
            // Simplified detection: Look for Red (Digital) vs Black/White (Analog)
            let isDigital = false;
            for(let i=0; i < sampleData.length; i+=4) {
                if(sampleData[i] > 150 && sampleData[i+1] < 100) { isDigital = true; break; }
            }

            if (isDigital) {
                decodeDigital();
            } else {
                decodeAnalog();
            }
        });

        function decodeAnalog() {
            decoder.log("Analog Waveform Detected. Running Variable Area Scan...");
            const width = decoder.canvas.width;
            const height = decoder.canvas.height;
            const imgData = decoder.ctx.getImageData(0, 0, width, height);
            const samples = new Float32Array(height);

            for (let y = 0; y < height; y++) {
                let darkPixels = 0;
                for (let x = 0; x < width; x++) {
                    const idx = (y * width + x) * 4;
                    // Threshold check for black pixels
                    if (imgData.data[idx] < 128) darkPixels++;
                }
                // Normalize pixel count back to audio amplitude
                samples[y] = (darkPixels / width) * 2 - 1;
            }

            finalizeAudio(samples, 8000);
        }

        function decodeDigital() {
            decoder.log("Digital Matrix Detected. Calibrating Bit-Grid...", "info");
            decoder.log("Note: Digital recovery requires high-res alignment.", "error");
            // In a production environment, this would use computer vision (OpenCV.js)
            // to align the red/black dots and reconstruct the file bytes.
            decoder.updateStatus("Alignment Error - Manual Check Required");
        }

        function finalizeAudio(samples, rate) {
            decoder.decodedBuffer = decoder.audioCtx.createBuffer(1, samples.length, rate);
            decoder.decodedBuffer.getChannelData(0).set(samples);
            document.getElementById('playBtn').disabled = false;
            decoder.log("Signal Recovered. Playback Engaged.");
            decoder.updateStatus("Ready for Playback");
        }

        document.getElementById('playBtn').addEventListener('click', () => {
            if (!decoder.decodedBuffer) return;
            const source = decoder.audioCtx.createBufferSource();
            source.buffer = decoder.decodedBuffer;
            source.connect(decoder.audioCtx.destination);
            source.start();
            decoder.log("Playing recovered audio...");
        });
    </script>
</body>
</html>
