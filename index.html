<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PAPERFORM PRO // HYBRID STATION</title>
    
    <style>
        :root { 
            --bg-dark: #09090b; --panel-dark: #121214; --border: #27272a;
            --neon-green: #00ff66; --neon-red: #ff003c; --text-main: #e4e4e7; --text-dim: #a1a1aa;
            --accent: var(--neon-green); /* Defaults to Analog Green */
        }
        
        body { background: var(--bg-dark); color: var(--text-main); font-family: 'JetBrains Mono', 'Courier New', monospace; margin: 0; display: flex; height: 100vh; overflow: hidden; transition: 0.3s; }
        
        #sidebar { width: 360px; background: var(--panel-dark); border-right: 1px solid var(--border); padding: 25px; display: flex; flex-direction: column; overflow-y: auto; z-index: 10; box-shadow: 5px 0 20px rgba(0,0,0,0.5); }
        #viewer { flex-grow: 1; display: flex; flex-direction: column; background: #000; justify-content: center; align-items: center; padding: 20px; position: relative; }
        
        .header { border-bottom: 2px solid var(--accent); padding-bottom: 15px; margin-bottom: 25px; transition: 0.3s; }
        .header h1 { color: var(--text-main); font-size: 1.4rem; margin: 0; letter-spacing: 3px; font-weight: 800; }
        .header span { color: var(--accent); }
        
        .module { background: #18181b; border: 1px solid var(--border); border-radius: 6px; padding: 18px; margin-bottom: 15px; transition: 0.3s; border-left: 3px solid var(--accent); }
        .module h3 { font-size: 0.75rem; color: var(--text-dim); margin-top: 0; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
        
        select, input[type="file"] { background: #09090b; color: var(--text-main); border: 1px solid var(--border); width: 100%; padding: 8px; margin-bottom: 12px; font-size: 0.75rem; border-radius: 4px; box-sizing: border-box; }
        select:focus, input[type="file"]:focus { outline: 1px solid var(--accent); }
        
        .btn-master { background: var(--accent); color: #000; border: none; padding: 14px; width: 100%; cursor: pointer; font-weight: bold; margin-top: 10px; border-radius: 4px; text-transform: uppercase; letter-spacing: 1px; transition: 0.2s; }
        .btn-master:hover { filter: brightness(1.3); box-shadow: 0 0 15px var(--accent); }
        
        .btn-secondary { background: transparent; border: 1px solid var(--text-dim); color: var(--text-dim); }
        .btn-secondary:hover { border-color: var(--text-main); color: var(--text-main); }

        canvas { max-height: 90%; max-width: 90%; background: white; box-shadow: 0 0 40px rgba(0,0,0,0.8); transition: 0.3s; }
        /* Pixelated rendering for crisp dots, auto for smooth waveforms */
        canvas.digital-mode { image-rendering: pixelated; }
        canvas.analog-mode { image-rendering: auto; }

        #console { height: 130px; background: #09090b; border-top: 1px solid var(--border); padding: 15px; color: var(--accent); font-size: 0.75rem; width: 100%; overflow-y: auto; box-sizing: border-box; transition: 0.3s; }

        /* Mode Switcher UI */
        .switch-container { display: flex; gap: 10px; margin-bottom: 15px; }
        .switch-btn { flex: 1; padding: 10px; background: #18181b; border: 1px solid var(--border); color: var(--text-dim); cursor: pointer; font-weight: bold; border-radius: 4px; transition: 0.2s; }
        .switch-btn.active-analog { background: var(--neon-green); color: #000; border-color: var(--neon-green); }
        .switch-btn.active-digital { background: var(--neon-red); color: #fff; border-color: var(--neon-red); }

        @media print { .no-print { display: none; } body { background: white; display: block; } #viewer { padding: 0; } canvas { width: 100% !important; height: auto !important; box-shadow: none; } }
    </style>
</head>
<body>

    <aside id="sidebar" class="no-print">
        <div class="header"><h1>PAPER<span>FORM</span> PRO</h1></div>
        
        <div class="module" style="border-left: none; padding: 0; background: transparent;">
            <div class="switch-container">
                <button class="switch-btn active-analog" id="btnAnalog" onclick="app.setMode('analog')">ANALOG (WAVE)</button>
                <button class="switch-btn" id="btnDigital" onclick="app.setMode('digital')">DIGITAL (DOTS)</button>
            </div>
        </div>

        <div class="module">
            <h3>1. Target Geometry</h3>
            <select id="paperSize">
                <option value="a4">A4 (210 x 297mm)</option>
                <option value="letter">US Letter (8.5 x 11in)</option>
            </select>
        </div>

        <div class="module">
            <h3>2. Source Media</h3>
            <input type="file" id="fileIn" accept="audio/*">
            <button class="btn-master" id="encodeBtn">INITIALIZE ENCODER</button>
        </div>

        <div class="module">
            <h3>3. Output Subsystem</h3>
            <button class="btn-master btn-secondary" onclick="window.print()">PRINT TO TARGET</button>
            <button class="btn-master btn-secondary" id="downloadPNG" style="margin-top: 8px;">EXPORT RAW PNG</button>
        </div>

        <div style="margin-top: auto; font-size: 0.6rem; color: #555; text-align: center;">SYS_VER: 3.0.0 // HYBRID CORE</div>
    </aside>

    <main id="viewer">
        <canvas id="canvas" class="analog-mode"></canvas>
        <div id="console" class="no-print">>> PAPERFORM HYBRID SYSTEM BOOTED. AWAITING DIRECTIVES...</div>
    </main>

    <script>
        /**
         * Core Application Engine (TypeScript Structural Style)
         * Manages state between Analog (Audio) and Digital (Binary) modes.
         */
        class PaperFormPro {
            constructor() {
                this.canvas = document.getElementById('canvas');
                this.ctx = this.canvas.getContext('2d');
                this.mode = 'analog'; // 'analog' or 'digital'
                this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                // Engine Parameters
                this.dotSize = 10; // Pixels per bit for Digital Mode
                this.analogWidthScale = 2.2; // Density of the Variable Area track
            }

            log(msg) {
                const con = document.getElementById('console');
                const time = new Date().toLocaleTimeString();
                con.innerHTML += `<br><span style="color:#555">[${time}]</span> >> ${msg.toUpperCase()}`;
                con.scrollTop = con.scrollHeight;
            }

            setMode(newMode) {
                this.mode = newMode;
                const root = document.documentElement;
                const fileInput = document.getElementById('fileIn');
                const btnAnalog = document.getElementById('btnAnalog');
                const btnDigital = document.getElementById('btnDigital');

                if (newMode === 'analog') {
                    root.style.setProperty('--accent', 'var(--neon-green)');
                    fileInput.accept = 'audio/*';
                    btnAnalog.classList.add('active-analog');
                    btnDigital.classList.remove('active-digital');
                    this.canvas.className = 'analog-mode';
                    this.log("Switched to Analog Waveform Mode.");
                } else {
                    root.style.setProperty('--accent', 'var(--neon-red)');
                    fileInput.removeAttribute('accept'); // Accept anything
                    btnDigital.classList.add('active-digital');
                    btnAnalog.classList.remove('active-analog');
                    this.canvas.className = 'digital-mode';
                    this.log("Switched to High-Density Digital Matrix Mode.");
                }
            }

            prepareCanvas(paperType) {
                // 300 DPI precise calculations
                if (paperType === 'a4') {
                    this.canvas.width = 2480; 
                    this.canvas.height = 3508;
                } else {
                    this.canvas.width = 2550; 
                    this.canvas.height = 3300;
                }
                this.ctx.fillStyle = "white";
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
            }
        }
        
        const app = new PaperFormPro();
    </script>

    <script>
        /**
         * Execution Logic
         * Routes the file to the correct encoder based on the system state.
         */
        document.getElementById('encodeBtn').addEventListener('click', async () => {
            const file = document.getElementById('fileIn').files[0];
            if (!file) return app.log("ERROR: NO INPUT FILE DETECTED");

            const paperType = document.getElementById('paperSize').value;
            app.prepareCanvas(paperType);
            app.log(`Processing ${file.name} | Target: ${paperType.toUpperCase()}`);

            if (app.mode === 'analog') {
                await processAnalog(file);
            } else {
                await processDigital(file);
            }
        });

        // --- CORE 1: ANALOG VARIABLE AREA ENCODER ---
        async function processAnalog(file) {
            try {
                const buffer = await app.audioCtx.decodeAudioData(await file.arrayBuffer());
                const raw = buffer.getChannelData(0);
                
                app.ctx.fillStyle = "black";
                const step = Math.floor(raw.length / app.canvas.height);
                const center = app.canvas.width / 2;
                
                for (let y = 0; y < app.canvas.height; y++) {
                    // Get amplitude and expand outward from the center
                    const amp = Math.abs(raw[y * step] || 0);
                    const width = amp * (app.canvas.width / app.analogWidthScale);
                    app.ctx.fillRect(center - width, y, width * 2, 1);
                }
                app.log("ANALOG WAVEFORM GENERATED. READY FOR PRINT.");
            } catch (e) {
                app.log("CRITICAL ERROR: File is not valid audio for Analog mode.");
            }
        }

        // --- CORE 2: DIGITAL BIT-MATRIX ENCODER ---
        async function processDigital(file) {
            const arrayBuffer = await file.arrayBuffer();
            const bytes = new Uint8Array(arrayBuffer);
            
            // 1. Draw Optical Sync Anchors (Red/Black corners)
            app.ctx.fillStyle = "#ff0000"; app.ctx.fillRect(0, 0, 150, 150); // Top-Left Red
            app.ctx.fillStyle = "#000000"; app.ctx.fillRect(app.canvas.width-150, 0, 150, 150); // Top-Right Black
            app.ctx.fillStyle = "#000000"; app.ctx.fillRect(0, app.canvas.height-150, 150, 150); // Bottom-Left Black

            // 2. Draw the Data Matrix
            let x = 180, y = 180; 
            const ds = app.dotSize;

            for (let byte of bytes) {
                for (let i = 7; i >= 0; i--) {
                    const bit = (byte >> i) & 1;
                    
                    // The core digital rule: 1 = Red, 0 = Black
                    app.ctx.fillStyle = (bit === 1) ? "#ff0000" : "#000000";
                    app.ctx.fillRect(x, y, ds, ds);
                    
                    x += ds;
                    if (x > app.canvas.width - 180) {
                        x = 180;
                        y += ds;
                    }
                }
            }
            app.log(`DIGITAL MATRIX COMPLETE. Encoded ${(bytes.length / 1024).toFixed(2)} KB of raw data.`);
        }

        // Output Utility
        document.getElementById('downloadPNG').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = `paperform_${app.mode}_${Date.now()}.png`;
            link.href = app.canvas.toDataURL();
            link.click();
            app.log("RAW IMAGE EXPORTED TO LOCAL STORAGE.");
        });
    </script>
</body>
</html>
