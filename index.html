<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PAPERFORM // OPTICAL MEDIA STATION</title>
    
    <style>
        :root { --p-green: #00ff41; --p-black: #0a0a0a; --p-gray: #1a1a1c; --p-text: #d1d1d1; --accent: #00e5ff; }
        body { background: var(--p-black); color: var(--p-text); font-family: 'Courier New', monospace; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        #sidebar { width: 340px; background: var(--p-gray); border-right: 1px solid #333; padding: 25px; display: flex; flex-direction: column; overflow-y: auto; }
        #viewer { flex-grow: 1; display: flex; flex-direction: column; background: #050505; position: relative; justify-content: center; align-items: center; padding: 20px; }
        
        .header { border-bottom: 1px solid var(--p-green); padding-bottom: 10px; margin-bottom: 25px; }
        .header h1 { color: var(--p-green); font-size: 1.2rem; margin: 0; letter-spacing: 4px; }
        
        .module { background: #222; border: 1px solid #333; border-radius: 4px; padding: 15px; margin-bottom: 15px; }
        .module h3 { font-size: 0.7rem; color: #888; margin-top: 0; text-transform: uppercase; margin-bottom: 10px; }
        
        select, input[type="file"] { background: #111; color: var(--p-green); border: 1px solid #444; width: 100%; padding: 5px; margin-bottom: 10px; font-size: 0.7rem; }
        
        .btn-p { background: var(--p-green); color: black; border: none; padding: 10px; width: 100%; cursor: pointer; font-weight: bold; margin-top: 5px; border-radius: 2px; text-transform: uppercase; }
        .btn-p:hover { filter: brightness(1.2); }
        .btn-alt { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
        
        canvas { max-height: 100%; max-width: 100%; box-shadow: 0 0 30px rgba(0,0,0,0.5); background: white; image-rendering: auto; }
        #console { height: 100px; background: #000; border-top: 1px solid #333; padding: 15px; color: var(--p-green); font-size: 0.75rem; overflow-y: auto; width: 100%; box-sizing: border-box; }

        @media print { .no-print { display: none; } body { background: white; display: block; } #viewer { padding: 0; } canvas { width: 100%; height: auto; box-shadow: none; } }
    </style>
</head>
<body>

    <aside id="sidebar" class="no-print">
        <div class="header"><h1>PAPERFORM</h1></div>
        
        <div class="module">
            <h3>1. Format Settings</h3>
            <select id="paperSize">
                <option value="a4">A4 (210 x 297mm)</option>
                <option value="letter">Letter (8.5 x 11in)</option>
            </select>
        </div>

        <div class="module">
            <h3>2. Encoder Unit</h3>
            <input type="file" id="audioLoad" accept="audio/*">
            <button class="btn-p" id="encodeTrigger">Process to Form</button>
        </div>

        <div class="module">
            <h3>3. Decoder Unit</h3>
            <input type="file" id="imageLoad" accept="image/*">
            <button class="btn-p btn-alt" id="decodeTrigger">Scan Image</button>
        </div>

        <div class="module">
            <h3>4. Output Factory</h3>
            <button class="btn-p" style="background: #eee;" onclick="window.print()">Save as PDF / Print</button>
            <button class="btn-p" style="background: #bbb;" id="downloadPNG">Download PNG</button>
        </div>

        <div style="margin-top: auto; font-size: 0.6rem; color: #444;">PAPERFORM // REL 1.1.0</div>
    </aside>

    <main id="viewer">
        <canvas id="output"></canvas>
        <div id="console" class="no-print">>> SYSTEM READY. STANDBY FOR INPUT...</div>
    </main>

    <script>
        /**
         * Structural Class Definitions
         * Handles the state management of the PaperForm application.
         */
        class PaperFormApp {
            constructor() {
                this.canvas = document.getElementById('output');
                this.ctx = this.canvas.getContext('2d');
                this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                this.bitrate = 8000;
            }

            log(msg) {
                const con = document.getElementById('console');
                con.innerHTML += `<br>>> ${msg.toUpperCase()}`;
                con.scrollTop = con.scrollHeight;
            }

            // Sets dimensions based on paper selection at 300 DPI
            setPaperMetrics(type) {
                if (type === 'a4') {
                    this.canvas.width = 2480;
                    this.canvas.height = 3508;
                } else {
                    this.canvas.width = 2550;
                    this.canvas.height = 3300;
                }
            }
        }
        const pf = new PaperFormApp();
    </script>

    <script>
        /**
         * Operational Logic
         * Handles the File I/O, Canvas rendering, and PNG generation.
         */
        document.getElementById('encodeTrigger').addEventListener('click', async () => {
            const file = document.getElementById('audioLoad').files[0];
            if (!file) return pf.log("Error: Select audio file");

            pf.log(`Encoding ${file.name}...`);
            const paperType = document.getElementById('paperSize').value;
            pf.setPaperMetrics(paperType);

            const buffer = await pf.audioCtx.decodeAudioData(await file.arrayBuffer());
            const raw = buffer.getChannelData(0);

            // Render Variable Area Track
            pf.ctx.fillStyle = "white";
            pf.ctx.fillRect(0, 0, pf.canvas.width, pf.canvas.height);
            pf.ctx.fillStyle = "black";

            const step = Math.floor(raw.length / pf.canvas.height);
            for (let i = 0; i < pf.canvas.height; i++) {
                const amp = Math.abs(raw[i * step] || 0);
                const w = amp * (pf.canvas.width / 2.2);
                pf.ctx.fillRect((pf.canvas.width / 2) - w, i, w * 2, 1);
            }
            pf.log(`Form Generated: ${paperType.toUpperCase()} Geometry.`);
        });

        document.getElementById('decodeTrigger').addEventListener('click', () => {
            const file = document.getElementById('imageLoad').files[0];
            if (!file) return pf.log("Error: Load image first");

            const img = new Image();
            img.src = URL.createObjectURL(file);
            img.onload = () => {
                pf.canvas.width = img.width;
                pf.canvas.height = img.height;
                pf.ctx.drawImage(img, 0, 0);
                
                const imgData = pf.ctx.getImageData(0, 0, pf.canvas.width, pf.canvas.height);
                const samples = new Float32Array(pf.canvas.height);

                for (let y = 0; y < pf.canvas.height; y++) {
                    let darkCount = 0;
                    for (let x = 0; x < pf.canvas.width; x++) {
                        const idx = (y * pf.canvas.width + x) * 4;
                        if (imgData.data[idx] < 127) darkCount++;
                    }
                    samples[y] = (darkCount / pf.canvas.width) * 2 - 1;
                }

                const track = pf.audioCtx.createBuffer(1, samples.length, pf.bitrate);
                track.getChannelData(0).set(samples);
                const source = pf.audioCtx.createBufferSource();
                source.buffer = track;
                source.connect(pf.audioCtx.destination);
                source.start();
                pf.log("Playback sequence initiated.");
            };
        });

        document.getElementById('downloadPNG').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = `paperform_${Date.now()}.png`;
            link.href = pf.canvas.toDataURL();
            link.click();
            pf.log("Exporting PNG file...");
        });
    </script>
</body>
</html>
