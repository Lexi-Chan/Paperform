<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PAPERFORM // OPTICAL AUDIO SYSTEM</title>
    
    <style>
        :root { --p-green: #00ff41; --p-black: #0a0a0a; --p-gray: #1a1a1a; --p-text: #d1d1d1; }
        body { background: var(--p-black); color: var(--p-text); font-family: 'Courier New', monospace; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        #sidebar { width: 320px; background: var(--p-gray); border-right: 1px solid #333; padding: 25px; display: flex; flex-direction: column; }
        #viewer { flex-grow: 1; display: flex; flex-direction: column; background: #050505; position: relative; }
        
        .header { border-bottom: 1px solid var(--p-green); padding-bottom: 10px; margin-bottom: 30px; }
        .header h1 { color: var(--p-green); font-size: 1.2rem; margin: 0; letter-spacing: 4px; }
        
        .module { background: #222; border: 1px solid #333; border-radius: 4px; padding: 15px; margin-bottom: 20px; }
        .module h3 { font-size: 0.7rem; color: #666; margin-top: 0; text-transform: uppercase; }
        
        .btn-p { background: var(--p-green); color: black; border: none; padding: 10px; width: 100%; cursor: pointer; font-weight: bold; margin-top: 10px; border-radius: 2px; }
        .btn-p:hover { background: #00cc33; }
        
        canvas { flex-grow: 1; object-fit: contain; cursor: crosshair; }
        #console { height: 120px; background: #000; border-top: 1px solid #333; padding: 15px; color: var(--p-green); font-size: 0.8rem; overflow-y: auto; }

        @media print { .no-print { display: none; } body { background: white; } canvas { width: 100%; } }
    </style>
</head>
<body>

    <aside id="sidebar" class="no-print">
        <div class="header"><h1>PAPERFORM</h1></div>
        
        <div class="module">
            <h3>Encoder Unit</h3>
            <input type="file" id="audioLoad" accept="audio/*" style="font-size: 0.6rem;">
            <button class="btn-p" id="encodeTrigger">GENERATE WAVE</button>
        </div>

        <div class="module">
            <h3>Decoder Unit</h3>
            <input type="file" id="imageLoad" accept="image/*" style="font-size: 0.6rem;">
            <button class="btn-p" style="background: transparent; border: 1px solid var(--p-green); color: var(--p-green);" id="decodeTrigger">SCAN FORM</button>
        </div>

        <button class="btn-p" style="background: white;" onclick="window.print()">PRINT TO A4/LETTER</button>
        <div style="margin-top: auto; font-size: 0.6rem; color: #444;">VER: 1.0.4 // PASSIC_NJ_USA</div>
    </aside>

    <main id="viewer">
        <canvas id="output"></canvas>
        <div id="console">>> SYSTEM INITIALIZED. AWAITING INPUT...</div>
    </main>

    <script>
        /**
         * Interface and Type definitions simulated for a single-file environment.
         * This section handles the data structures and class definitions.
         */
        class PaperFormEngine {
            constructor() {
                this.canvas = document.getElementById('output');
                this.ctx = this.canvas.getContext('2d');
                this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                this.bitrate = 8000;
            }

            log(msg) {
                const con = document.getElementById('console');
                con.innerHTML += `<br>>> ${msg}`;
                con.scrollTop = con.scrollHeight;
            }
        }
        const pf = new PaperFormEngine();
    </script>

    <script>
        /**
         * Functional JS handles the heavy lifting and event listeners.
         */
        document.getElementById('encodeTrigger').addEventListener('click', async () => {
            const file = document.getElementById('audioLoad').files[0];
            if (!file) return pf.log("ERROR: NO AUDIO LOADED");

            pf.log("DECODING PCM DATA...");
            const buffer = await pf.audioCtx.decodeAudioData(await file.arrayBuffer());
            const raw = buffer.getChannelData(0);

            // Setting canvas for high-density Variable Area print
            pf.canvas.width = 1600;
            pf.canvas.height = 3200;
            pf.ctx.fillStyle = "white";
            pf.ctx.fillRect(0, 0, pf.canvas.width, pf.canvas.height);
            pf.ctx.fillStyle = "black";

            const step = Math.floor(raw.length / pf.canvas.height);
            for (let i = 0; i < pf.canvas.height; i++) {
                const amp = Math.abs(raw[i * step] || 0);
                const w = amp * (pf.canvas.width / 2);
                pf.ctx.fillRect((pf.canvas.width / 2) - w, i, w * 2, 1);
            }
            pf.log("PAPERFORM GENERATED. READY FOR PRINT.");
        });

        document.getElementById('decodeTrigger').addEventListener('click', () => {
            const file = document.getElementById('imageLoad').files[0];
            if (!file) return pf.log("ERROR: NO IMAGE LOADED");

            const img = new Image();
            img.src = URL.createObjectURL(file);
            img.onload = () => {
                pf.canvas.width = img.width;
                pf.canvas.height = img.height;
                pf.ctx.drawImage(img, 0, 0);
                
                pf.log("COMMENCING OPTICAL SCAN...");
                const imgData = pf.ctx.getImageData(0, 0, pf.canvas.width, pf.canvas.height);
                const samples = new Float32Array(pf.canvas.height);

                for (let y = 0; y < pf.canvas.height; y++) {
                    let density = 0;
                    for (let x = 0; x < pf.canvas.width; x++) {
                        const idx = (y * pf.canvas.width + x) * 4;
                        if (imgData.data[idx] < 127) density++;
                    }
                    samples[y] = (density / pf.canvas.width) * 2 - 1;
                }

                const track = pf.audioCtx.createBuffer(1, samples.length, pf.bitrate);
                track.getChannelData(0).set(samples);
                const node = pf.audioCtx.createBufferSource();
                node.buffer = track;
                node.connect(pf.audioCtx.destination);
                node.start();
                pf.log("PLAYBACK ACTIVE.");
            };
        });
    </script>
</body>
</html>
